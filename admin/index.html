<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול אישורי הגעה</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="card admin-card">
        <h1>סטטוס אישורי הגעה</h1>
        <p class="admin-note">דף זה מושך נתונים מ-endpoint ה-RSVP.</p>

        <div class="totals">
          <div class="total-box">
            <span>סה״כ משפחות</span>
            <strong id="totalFamilies">-</strong>
          </div>
          <div class="total-box">
            <span>סה״כ ילדים</span>
            <strong id="totalKids">-</strong>
          </div>
        </div>

        <button id="refreshBtn" class="btn">רענון נתונים</button>
        <p id="adminMessage" class="form-message" aria-live="polite"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>זמן</th>
                <th>שם המוזמן</th>
                <th>ילדים</th>
              </tr>
            </thead>
            <tbody id="entriesTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../admin.js"></script>
  </body>
</html>
